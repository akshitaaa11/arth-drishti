name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install, type-check and build the dashboard
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true  # data/csv/prices_daily.csv is stored in Git LFS
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Type check
        run: python -m mypy src
      - name: Unit tests
        run: python -m pytest -q

  migrate-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: bsp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bsp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/bsp
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true  # data/csv/prices_daily.csv is stored in Git LFS
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Migrate a clean Postgres database
        run: python -m alembic upgrade head
      - name: make load (first run) and verify rows match the CSVs
        run: |
          make load
          python scripts/verify_load.py
      - name: make load (second run, must be idempotent) and verify again
        run: |
          make load
          python scripts/verify_load.py
