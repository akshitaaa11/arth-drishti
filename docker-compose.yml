services:
  postgres:
    image: postgres:15-alpine
    container_name: arth-drishti-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bsp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bsp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: arth-drishti-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The product: the FastAPI app that also serves the dashboard at http://localhost:8000/app/  (docker compose up --build api)
  api:
    build: .
    container_name: arth-drishti-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      # Copy .env.example to .env and put your key there; compose reads it from that file. Without a key the Copilot answers
      # with its rule-based writer instead of the Groq model. The key is never baked into the image.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      GROQ_BACKUP_MODEL: ${GROQ_BACKUP_MODEL:-}
    ports:
      - "8000:8000"

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: arth-drishti-mlflow
    restart: unless-stopped
    command: >
      mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlruns --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlruns

volumes:
  postgres_data:
  mlflow_data:
