[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arth-drishti"
version = "0.1.0"
description = "Budget-based sector growth and stock return prediction"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Arth Drishti Team" }]
license = { text = "MIT" }

dependencies = [
  "alembic>=1.13.1",
  "fastapi>=0.111.0",
  "pandas>=2.2.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0.2",
  "requests>=2.31.0",
  "SQLAlchemy>=2.0.30",
  "uvicorn>=0.29.0",
  "yfinance>=0.2.40",
  "pdfplumber>=0.11.0",
  "html5lib>=1.1",
  "lxml>=5.0.0",
  "pandera>=0.20.0",
  "apscheduler>=3.10,<4",
  "psycopg2-binary>=2.9",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "mlflow>=3.0",
  "lightgbm>=4.3",
  "optuna>=3.6",
  "pymc>=5.10",
  "arviz>=0.18",
  "shap>=0.45",
  "matplotlib>=3.8",
  "redis>=5.0",
  "streamlit>=1.40",
  "mapie>=1.0",
]

[project.optional-dependencies]
dev = [
  "fakeredis>=2.20",
  "mypy>=1.10.0",
  "pandas-stubs>=2.2.0",
  "pytest>=8.2.0",
  "ruff>=0.5.0",
  "types-requests>=2.31.0",
  "types-PyYAML>=6.0.12",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["bsp*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["bsp"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["redis", "redis.*", "streamlit", "streamlit.*", "matplotlib", "matplotlib.*", "shap", "shap.*", "mapie", "mapie.*", "pymc", "pymc.*", "arviz", "arviz.*", "lightgbm", "lightgbm.*", "optuna", "optuna.*", "yfinance", "apscheduler", "apscheduler.*", "sklearn", "sklearn.*", "scipy", "scipy.*", "mlflow", "mlflow.*"]
ignore_missing_imports = true
